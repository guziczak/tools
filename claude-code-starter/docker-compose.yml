services:
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-code-container:latest
    container_name: claude-persistent
    hostname: claude-container
    stdin_open: true
    tty: true

    # Root user for mount namespace capabilities
    user: root

    # Security capabilities for namespace operations
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined

    # Volume configuration
    volumes:
      # Host filesystem mounts - adjust based on OS
      # For Windows, mount specific drives
      - type: bind
        source: C:/
        target: /host_c
        read_only: true

      # Uncomment if you have D: drive
      # - type: bind
      #   source: D:/
      #   target: /host_d
      #   read_only: true

      # For Linux/Mac, use this instead:
      # - type: bind
      #   source: /
      #   target: /host
      #   read_only: true

      # Shared volume for tools installed across sessions
      - type: volume
        source: claude-shared-tools
        target: /opt/claude-shared

      # Shared system directories for apt packages
      - type: volume
        source: claude-apt-cache
        target: /var/cache/apt

      - type: volume
        source: claude-apt-lib
        target: /var/lib/apt

      - type: volume
        source: claude-usr-local
        target: /usr/local

    # Working directory
    working_dir: /home/claude

    # Restart policy
    restart: unless-stopped

    # Add init for proper signal handling
    init: true
    
    # Add tmpfs for temporary files
    tmpfs:
      - /tmp:size=1G,mode=1777
    
    # Start cleanup daemon and keep container running
    command: |
      bash -c '
        # Start cleanup daemon in background
        /usr/local/bin/claude-cleanup-daemon &
        # Keep container running
        exec sleep infinity
      '

    # Environment variables
    environment:
      - DOCKER_BUILDKIT=1
      - COMPOSE_DOCKER_CLI_BUILD=1
      - TZ=${TZ:-UTC}

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '${CLAUDE_CPU_LIMIT:-6}'
          memory: ${CLAUDE_MEMORY_LIMIT:-12G}
        reservations:
          cpus: '${CLAUDE_CPU_RESERVATION:-2}'
          memory: ${CLAUDE_MEMORY_RESERVATION:-4G}

    # Health check - verify cleanup daemon is running
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f claude-cleanup-daemon || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=claude-code"

# Definicja woluminów
volumes:
  claude-shared-tools:
    name: claude-shared-tools
  claude-apt-cache:
    name: claude-apt-cache
  claude-apt-lib:
    name: claude-apt-lib
  claude-usr-local:
    name: claude-usr-local